# SecureX-Assist Production Configuration
# HARDENED SECURITY CONFIGURATION FOR PRODUCTION DEPLOYMENT
# All security features enabled, no bypasses

app:
  name: "SecureX-Assist"
  version: "1.0.0"
  theme: "sci-fi"
  log_level: "INFO"  # Use WARNING or ERROR in production to reduce log size

system:
  # ==================== SECURITY HARDENING ====================
  # ❗ CRITICAL: All flags must be set correctly for production
  
  development_mode: false  # NEVER enable in production
  bypass_anti_spoofing: false  # NEVER bypass security checks
  bypass_anti_spoofing_verify: false
  
  # Stricter thresholds for production
  spoof_confidence_min: 0.85  # High confidence required for enrollment
  spoof_confidence_min_verify: 0.70  # Strict verification
  min_security_confidence: 0.70  # Elevated minimum confidence
  voice_threshold: 0.35  # Stricter voice matching (lower = more strict)
  base_voice_threshold: 0.30
  cosine_verify_threshold: 0.52  # Primary voice match gate threshold
  
  # Enhanced security features
  adaptive_threshold: true
  voice_update_learning: true
  quiet_environment_adaptation: true
  force_anti_spoof_fallback: false  # Use advanced AASIST models
  
  # Session management
  session_timeout: 1800  # 30 minutes (more secure than 1 hour)
  max_login_attempts: 3  # Lock after 3 failed attempts
  
  # Multi-factor authentication (REQUIRED)
  require_liveness: true  # ❗ CRITICAL
  multi_factor: true  # ❗ CRITICAL - 3FA enabled
  
  # Enrollment requirements (stricter)
  enrollment_samples: 5  # More samples = better accuracy
  min_match_samples: 3  # Majority must match
  
  # Anti-spoofing (SOTA Security)
  enable_anti_spoofing: true  # ❗ CRITICAL
  enable_liveness_check: true  # ❗ CRITICAL
  enable_noise_normalization: true
  anti_spoof_mode: "advanced"  # Use AASIST (SOTA)
  anti_spoof_timeout_seconds: 3
  anti_spoof_max_audio_seconds: 3

  # Voice quality hardening (noise robustness)
  min_voice_quality_score: 0.32
  min_snr_db: 10.0
  max_clipping_ratio: 0.010
  min_verify_audio_seconds: 1.2
  enable_denoise_for_embedding: true
  denoise_strength: 0.40

audio:
  sample_rate: 16000
  channels: 1
  chunk_size: 1024
  recording_duration: 6
  min_speech_duration: 1.0  # Require longer speech for better accuracy
  min_audio_energy: 0.005  # Higher threshold to reject noise
  vad_aggressiveness: 1  # More aggressive VAD for production

augmentation:
  pitch_shift: [-2, 2]  # Less augmentation in production
  gain_db: [-3, 3]
  speed_factor: [0.97, 1.03]
  noise_level: 0.005  # Lower noise addition

tts:
  enabled: true
  model_path: "models/piper/en_US-lessac-medium.onnx"
  voice: female
  rate: 1.0
  volume: 0.9
  rate_wpm: 170
  short_mode: true
  default_blocking: false

models:
  primary_embedding: "pyannote/embedding"
  fallback_embedding: "speechbrain/spkrec-ecapa-voxceleb"
  vad_model: "silero-vad"
  stt_model: "tiny"  # Whisper tiny model for speed

database:
  path: "securex_db.sqlite"  # Use PostgreSQL in production!
  backup_enabled: true
  backup_interval: 86400  # Daily backups

security:
  # ==================== SECURITY FEATURES ====================
  enable_audit_logging: true  # ❗ CRITICAL: Log all security events
  audit_log_path: "logs/audit.log"
  
  # Password requirements
  password_min_length: 12
  password_require_complexity: true
  
  # Session security
  session_token_rotation: true
  secure_cookies: true
  
  # Rate limiting
  enable_rate_limiting: true
  rate_limit_per_minute: 60
  rate_limit_per_hour: 500
  
  # Brute force protection
  enable_brute_force_protection: true
  lockout_duration_seconds: 900  # 15 minutes
  
  # IP filtering (optional)
  enable_ip_whitelisting: false
  allowed_ips: []  # Add trusted IPs if enabling whitelist

fusion:
  # Multi-modal biometric fusion
  strategy: "adaptive"  # adaptive, weighted_sum, or conservative
  threshold: 0.75  # Higher threshold for production
  
  # Weights for weighted_sum strategy
  voice_weight: 0.35
  face_weight: 0.30
  voice_liveness_weight: 0.15
  face_liveness_weight: 0.15
  anti_spoof_weight: 0.05

ui:
  window_width: 1000
  window_height: 700
  theme_color: "#00ff41"
  animation_speed: 300
  enable_debug_panel: false  # ❗ Disable in production

api:
  # REST API settings
  enabled: true
  host: "0.0.0.0"
  port: 8000
  cors_enabled: true
  cors_origins:  # Set via environment variable CORS_ORIGINS
    - "https://yourdomain.com"
  rate_limiting_enabled: true
  api_key_required: true
  
  # JWT settings
  jwt_expiry_seconds: 3600  # 1 hour
  jwt_refresh_enabled: true
  jwt_refresh_expiry_seconds: 86400  # 24 hours

monitoring:
  # Performance and health monitoring
  enable_performance_monitoring: true
  enable_health_checks: true
  health_check_interval: 60  # seconds
  
  # Alerting (configure with external service)
  enable_alerting: false
  alert_on_failed_logins: true
  alert_threshold: 5  # Alert after 5 failed attempts
  
  # Metrics export (for Prometheus/Grafana)
  enable_metrics_export: false
  metrics_port: 9090

logging:
  # Logging configuration
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR, CRITICAL
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  
  # Log rotation
  enable_rotation: true
  max_bytes: 10485760  # 10MB
  backup_count: 10
  
  # Sensitive data filtering
  mask_passwords: true
  mask_tokens: true
  mask_biometric_data: true

performance:
  # Performance optimization
  enable_caching: true
  cache_size: 200
  cache_ttl: 3600
  
  # Model optimization
  preload_models: true
  use_gpu: false  # Set to true if CUDA available
  batch_processing: false
  
  # Connection pooling
  database_pool_size: 20
  database_max_overflow: 10
  
  # Timeouts
  request_timeout_seconds: 30
  model_inference_timeout_seconds: 10

# ==================== PRODUCTION CHECKLIST ====================
# Before deploying to production, verify:
# ✓ development_mode: false
# ✓ All bypass flags: false  
# ✓ require_liveness: true
# ✓ multi_factor: true
# ✓ enable_anti_spoofing: true
# ✓ enable_audit_logging: true
# ✓ Database migrated to PostgreSQL
# ✓ JWT_SECRET set in environment
# ✓ CORS configured for your domain
# ✓ SSL/TLS enabled
# ✓ Backups configured
# ✓ Monitoring enabled
